pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
    plugins {
        // Architectury Loom builds Fabric, Forge and NeoForge from the same Yarn-named sources.
        id "dev.architectury.loom" version "1.11.458"
    }
}

rootProject.name = "blockyard-ui"

// One project per loader and game version. Sources are shared:
//   common/       the launcher-style views drawn with Java2D, no Minecraft code;
//   mc-<version>/ screens, canvas and mixins for that game version;
//   <loader>-<version>/ the loader's entry, metadata and platform calls.
include "fabric-1.20.1", "forge-1.20.1",
        "fabric-1.20.2", "neoforge-1.20.2",
        "fabric-1.20.4", "neoforge-1.20.4",
        "fabric-1.20.6", "neoforge-1.20.6",
        "fabric-1.21.1", "neoforge-1.21.1",
        "fabric-1.21.3", "neoforge-1.21.3",
        "fabric-1.21.4", "neoforge-1.21.4",
        "fabric-1.21.5", "neoforge-1.21.5",
        "fabric-1.21.8", "neoforge-1.21.8"
