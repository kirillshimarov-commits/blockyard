// The unobfuscated game versions (26.x): built with the loaders' own non-remapping Gradle
// plugins on Java 25, so they live in a build of their own next to the Architectury one.
// The projects themselves sit in mod/ like every other version (mod/<loader>-<version>/).
pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
    plugins {
        id "net.fabricmc.fabric-loom" version "1.18.4"
        id "net.neoforged.moddev" version "2.0.148"
    }
}

rootProject.name = "blockyard-ui-next"

// 26.2 and 26.3 follow once 26.1 works.
for (target in ["fabric-26.1", "neoforge-26.1"]) {
    include target
    project(":${target}").projectDir = file("../${target}")
}
