name: Mod screenshots

# Runs the game with the mod on a virtual screen, walks through every menu (Selftest) and
# publishes the screenshots to the "shots" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game
        working-directory: mod
        env:
          BLOCKYARD_SELFTEST: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p run
          printf 'lang:ru_ru\nonboardAccessibility:false\nguiScale:0\nskipMultiplayerWarning:true\ntutorialStep:none\nsoundCategory_master:0.0\nrenderDistance:4\nsimulationDistance:5\n' > run/options.txt
          timeout 35m xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon > run/gradle-run.log 2>&1 || true
          tail -50 run/gradle-run.log
          ls -la run/screenshots || true
      - name: Publish screenshots
        run: |
          mkdir -p /tmp/shots
          cp mod/run/screenshots/*.png /tmp/shots/ || true
          cp mod/run/logs/latest.log /tmp/shots/latest.log || true
          tail -300 mod/run/gradle-run.log > /tmp/shots/gradle-run.log || true
          cd /tmp/shots
          git init -q && git checkout -q -b shots
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots
