name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Версия релиза, например v0.2.0 (пусто — просто сборка)"
        required: false
        default: ""

jobs:
  # The in-game menu mod (Fabric, Quilt, Forge and NeoForge builds); the launcher embeds the jar and installs it into matching instances.
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build mod
        working-directory: mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: blockyard-ui-mod
          path: mod/*/build/libs/blockyard-ui-*.jar

  windows:
    needs: mod
    # A broken mod build must not block launcher releases: the launcher then simply ships without it.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Embedded into the app at compile time; CurseForge is disabled when the secret is missing.
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Azure app id for Microsoft login; the button is disabled when it is missing.
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      # Discord application id for Rich Presence; the profile status is off when it is missing.
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: blockyard-ui-mod
          path: mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: blockyard-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # A v* tag, or "Run workflow" with a version, publishes the installer on the Releases page.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Blockyard ${{ inputs.release || github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
